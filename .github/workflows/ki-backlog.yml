# Katman 4 (24.10.2026) — Kod hatti: Code-Backlog-Karte -> Pull Request.
#
# Gestartet von lib/ausfuehrung/code-hat.ts (workflow_dispatch ueber die
# GitHub-API), nie von selbst. Claude Code darf NUR Dateien lesen und aendern
# (kein git, keine Shell ausser tsc/lint). Alles Weitere machen die festen
# Schritte unten: pruefen, Zweig ki/<karte>, Commit, Push, PR gegen
# feat/system-haus-site. Gemerged wird nur von Emin.
#
# Einmalig noetig (Inhaber):
#   - Secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) ODER ANTHROPIC_API_KEY
#   - Settings -> Actions -> General -> "Allow GitHub Actions to create and
#     approve pull requests" einschalten
#   - Diese Datei muss auch auf dem Standardzweig (main) liegen, damit GitHub
#     den Workflow per API starten laesst.
name: KI-Backlog

on:
  workflow_dispatch:
    inputs:
      karte:
        description: "ID der Code-Backlog-Karte (frg-...)"
        required: true
      auftrag:
        description: "Auftrag fuer Claude Code"
        required: true

concurrency:
  group: ki-backlog
  cancel-in-progress: false

jobs:
  pr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NEXT_PUBLIC_SITE_URL: "https://creadig.de"
      KARTE: ${{ inputs.karte }}
      AUFTRAG: ${{ inputs.auftrag }}

    steps:
      - name: Karte pruefen
        run: |
          [[ "$KARTE" =~ ^[a-zA-Z0-9-]{4,64}$ ]] || { echo "Ungueltige Karten-ID"; exit 1; }
          echo "ZWEIG=ki/$KARTE" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: feat/system-haus-site
          fetch-depth: 0

      - name: Zweig schon vorhanden?
        run: |
          if git ls-remote --exit-code --heads origin "$ZWEIG" >/dev/null; then
            echo "$ZWEIG existiert schon – kein zweiter Versuch fuer diese Karte."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Du arbeitest im Repository von creaDIG Solutions (Next.js App Router, TypeScript, Neon Postgres).
            Lies zuerst CLAUDE.md und AGENTS.md, falls vorhanden, und halte dich an Stil und Kommentar-Dichte des umgebenden Codes.

            Auftrag aus dem Code-Backlog (Karte ${{ inputs.karte }}):
            ---
            ${{ inputs.auftrag }}
            ---

            Regeln:
            - Aendere nur Dateien, die der Auftrag braucht. Kein git, kein Commit, kein Push – das erledigt der Workflow.
            - Keine Geheimnisse, keine .env-Dateien, keine Aenderungen an .github/.
            - Nichts, was nach aussen sendet (Mail, Brief, LinkedIn, Zahlungen), ohne die bestehende Freigabe-Logik.
            - Pruefe am Ende mit `npx tsc --noEmit` und `npm run lint` und behebe Fehler.
            - Ist der Auftrag unklar, nicht sinnvoll oder schon erledigt: aendere nichts.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npx tsc --noEmit),Bash(npm run lint)"

      - name: Aenderungen?
        id: diff
        run: |
          git checkout -- .github 2>/dev/null || true; git clean -fdq .github
          if [ -z "$(git status --porcelain)" ]; then echo "leer=1" >> "$GITHUB_OUTPUT"; echo "Keine Aenderung – kein PR."; else echo "leer=0" >> "$GITHUB_OUTPUT"; fi

      - name: Typen
        if: steps.diff.outputs.leer == '0'
        run: npx tsc --noEmit

      - name: Regeln
        if: steps.diff.outputs.leer == '0'
        run: npm run lint

      - name: Bauen
        if: steps.diff.outputs.leer == '0'
        run: npm run build

      - name: Commit, Push, PR
        if: steps.diff.outputs.leer == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "creaDIG KI-Backlog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ZWEIG"
          git add -A
          TITEL="$(printf '%s' "$AUFTRAG" | head -n1 | cut -c1-90)"
          git commit -m "KI-Backlog: $TITEL" -m "Karte $KARTE" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git push origin "$ZWEIG"
          {
            echo "Automatisch aus dem Code-Backlog (Karte \`$KARTE\`)."
            echo
            echo "**Vor dem Merge:** Vercel-Vorschau ansehen und den Diff pruefen. Geprueft im Workflow: tsc, lint, build."
            echo
            echo "<details><summary>Auftrag</summary>"
            echo
            printf '%s\n' "$AUFTRAG"
            echo
            echo "</details>"
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > /tmp/pr.md
          gh pr create --base feat/system-haus-site --head "$ZWEIG" --title "KI-Backlog: $TITEL" --body-file /tmp/pr.md
