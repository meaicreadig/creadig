    <style>
      .edge {
        fill: none; stroke: #EFDCA5; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: draw 2.7s cubic-bezier(.45,.05,.5,.95) 0.15s forwards, edgeFade 0.9s ease 3.3s forwards;
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes edgeFade { to { stroke-opacity: 0; } }

      /* Verdeckung des Hinwegs erscheint, wenn der Rueckweg das Kreuz erreicht */
      .hole { opacity: 0; animation: holeOn 0.14s ease 1.78s forwards; }
      @keyframes holeOn { to { opacity: 1; } }

      /* Rueckweg-Segment oben drauf (durchgehend ueber dem Hinweg) */
      .over {
        fill: none; stroke: #EFDCA5; stroke-width: 3.5; stroke-linecap: round;
        opacity: 0; animation: overOn 0.22s ease 1.78s forwards, edgeFade 0.9s ease 3.3s forwards;
      }
      @keyframes overOn { to { opacity: 1; } }

      .goldfill { opacity: 0; animation: fillIn 0.9s ease 3.35s forwards; }
      @keyframes fillIn { to { opacity: 1; } }
      .glow { opacity: 0; animation: flash 1.2s ease 3.4s forwards, breathe 4.5s ease-in-out 4.6s infinite; }
      @keyframes flash { 0% {opacity:0;} 50% {opacity:0.85;} 100% {opacity:0.30;} }
      @keyframes breathe { 0%,100% {opacity:0.30;} 50% {opacity:0.62;} }

      .drop { opacity:0; transform-box: fill-box; transform-origin: center bottom;
        animation: dropIn 0.45s cubic-bezier(.55,0,.85,.45) 4.3s forwards, squash 0.5s cubic-bezier(.3,1.8,.5,1) 4.75s forwards; }
      @keyframes dropIn { 0% {opacity:0; transform: translateY(-34px);} 25% {opacity:1;} 100% {opacity:1; transform: translateY(0);} }
      @keyframes squash { 0% {transform: translateY(0) scale(1,1);} 40% {transform: translateY(0) scale(1.25,0.7);} 100% {transform: translateY(0) scale(1,1);} }
      .ripple { fill:none; stroke:#E8C56A; opacity:0; transform-box: fill-box; transform-origin: center;
        animation: ripple 0.7s ease-out 4.8s forwards; }
      @keyframes ripple { 0% {opacity:0.7; transform: scale(0.2); stroke-width:4;} 100% {opacity:0; transform: scale(1.6); stroke-width:0.5;} }

      @media (prefers-reduced-motion: reduce) {
        .edge, .over { animation: none; stroke-opacity: 0; }
        .hole { animation: none; opacity: 0; }
        .goldfill { animation: none; opacity: 1; }
        .drop { animation: none; opacity: 1; transform: none; }
        .ripple { animation: none; opacity: 0; }
        .glow { animation: none; opacity: 0.35; }
      }
    </style>
